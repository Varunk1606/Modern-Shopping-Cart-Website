<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grocery Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="container">
            <div class="title">
                <img width="35px" src="img/grocery-logo.svg" alt="">
                <h1>Grocery Managemnet System</h1>
            </div>
            <div class="btn">
                <button class="login">Log in</button>
                <button class="signup">Sign Up</button>
            </div>
        </div>
    </header>
    <main class="main">
        <div class="section">
            <div class="control">
                <div class="search">
                    <input type="text" id="search" placeholder="Search products (e.g. apple, milk)" />
                    <div class="muted">Tax: <strong>10%</strong></div>
                </div>
            </div>
            <div class="grid">
                <div class="card">
                    <div class="product-image"><img width="80px" height="80px" style="border-radius: 10px; ;"
                            src="img/apple.jpg" alt=""></div>
                    <div class="product-name">
                        <p>Apple (1KG)</p>
                        <div class="price">Price:$100  Stock:50</div>
                    </div>
                    <button class="addbtn">ADD</button>
                </div>
                <div class="card">
                    <div class="product-image"><img width="80px" height="80px" style="border-radius: 10px; ;"
                            src="img/banana.png" alt=""></div>
                    <div class="product-name">
                        <p>Banana (1KG)</p>
                        <div class="price">Price:$100  Stock:50</div>
                    </div>
                    <button class="addbtn">ADD</button>
                </div>
            </div>
        </div>
        <div class="aside">
            <div class="cart-panel">
                <div class="cart-header">
                    <h2>🛒 Shopping Cart</h2>
                    <span class="cart-count">0 items</span>
                </div>
                
                <div class="cart-items">
                    <!-- Cart items will be dynamically added here -->
                    <div class="empty-cart">
                        <p>Your cart is empty</p>
                        <span>Add some products to get started!</span>
                    </div>
                </div>
                
                <div class="cart-summary">
                    <div class="summary-row">
                        <span>Subtotal:</span>
                        <span class="subtotal">$0.00</span>
                    </div>
                    <div class="summary-row">
                        <span>Tax (10%):</span>
                        <span class="tax">$0.00</span>
                    </div>
                    <div class="summary-row total">
                        <span>Total:</span>
                        <span class="total-amount">$0.00</span>
                    </div>
                </div>
                
                <div class="cart-actions">
                    <button class="clear-cart">Clear Cart</button>
                    <button class="checkout-btn">Checkout</button>
                </div>
            </div>
        </div>
    </main>
    <footer>
        <p>&copy; 2025 MyWebsite. All rights reserved.</p>
    </footer>
    <script src="server.js"></script>
</body>

</html>
